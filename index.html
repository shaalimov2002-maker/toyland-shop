<!-- Slide-out Favorites Drawer -->
<div id="favorites-drawer-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300" onclick="toggleFavoritesModal(false)"></div>
<div id="favorites-drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-out flex flex-col justify-between">
    <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-pink-100 text-toy-pink rounded-xl">
                <i data-lucide="heart" class="w-6 h-6"></i>
            </div>
            <div>
                <h3 class="text-xl font-heading font-bold text-slate-800">Избранное</h3>
                <p id="fav-count-subtitle" class="text-xs text-slate-500">0 товаров</p>
            </div>
        </div>
        <button onclick="toggleFavoritesModal(false)" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
    </div>

    <div id="favorites-items-container" class="flex-1 overflow-y-auto p-6 space-y-4">
        <!-- Здесь будут появляться выбранные товары -->
    </div>
</div>
